<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25"/>
  
  <!-- Accounting Ledger & Scale Emblem -->
  <g transform="translate(256, 256)">
    <!-- Shield / Base Shape -->
    <path d="M-140,-80 C-140,-80 0,-140 0,-140 C0,-140 140,-80 140,-80 C140,40 80,140 0,180 C-80,140 -140,40 -140,-80 Z" 
          fill="#0f172a" stroke="url(#accentGrad)" stroke-width="12" filter="url(#glow)"/>
    
    <!-- Balance Scale Center Pillar -->
    <line x1="0" y1="-80" x2="0" y2="110" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
    <line x1="-50" y1="110" x2="50" y2="110" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-90" r="14" fill="#34d399"/>
    
    <!-- Balance Beam -->
    <line x1="-90" y1="-50" x2="90" y2="-50" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Left Pan (Debit) -->
    <line x1="-90" y1="-50" x2="-115" y2="0" stroke="#94a3b8" stroke-width="4"/>
    <line x1="-90" y1="-50" x2="-65" y2="0" stroke="#94a3b8" stroke-width="4"/>
    <path d="M-125,0 Q-90,30 -55,0 Z" fill="#10b981"/>
    
    <!-- Right Pan (Credit) -->
    <line x1="90" y1="-50" x2="65" y2="0" stroke="#94a3b8" stroke-width="4"/>
    <line x1="90" y1="-50" x2="115" y2="0" stroke="#94a3b8" stroke-width="4"/>
    <path d="M55,0 Q90,30 125,0 Z" fill="#10b981"/>
    
    <!-- E Symbol Center -->
    <text x="0" y="70" font-family="'Cairo', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">E</text>
  </g>
</svg>
